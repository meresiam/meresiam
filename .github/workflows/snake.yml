name: Generate snake animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-meres.svg?color_snake=%23FF0033&color_dots=%231a0000,%23330000,%23660000,%23aa0011,%23FF0033
            dist/github-snake-light.svg?color_snake=%23FF0033&color_dots=%23ffe5e9,%23ffb3bf,%23ff6680,%23ff334d,%23FF0033
            dist/ouroboros.svg?color_snake=%23FF0033&color_dots=%231a0000,%23330000,%23660000,%23aa0011,%23FF0033

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
