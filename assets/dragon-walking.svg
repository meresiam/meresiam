<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 96" width="800" height="96" role="img" aria-label="Dragão pixelado caminhando">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .ground { fill: #FF0033; opacity: 0.18; }
    </style>
  </defs>

  <!-- fundo preto -->
  <rect class="bg" width="800" height="96" />
  <!-- chão neon -->
  <rect class="ground" x="0" y="84" width="800" height="3" />
  <rect class="ground" x="0" y="89" width="800" height="1" />

  <!-- DRAGÃO: pixel art 22x16, scale 4 = 88x64. Se move 0 -> 800 em 12s, com bounce vertical -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-90,0; 800,0"
      dur="14s" repeatCount="indefinite" />
    <g>
      <!-- bounce vertical sincronizado com walk cycle -->
      <animateTransform attributeName="transform" type="translate"
        values="0,16; 0,12; 0,16; 0,12; 0,16"
        dur="0.4s" repeatCount="indefinite" />

      <!-- pixel grid 22x16, cada pixel = 4x4 -->
      <!-- Paleta:
           D = #FF0033  (vermelho neon principal)
           B = #B30022  (vermelho escuro contorno)
           F = #FFAA00  (chama)
           Y = #FFFF00  (chama center)
           W = #FFFFFF  (olho)
           K = #000000  (pupila)
      -->
      <g shape-rendering="crispEdges">
        <!-- linha 0 (topo): orelhas -->
        <rect x="16" y="0" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="0" width="4" height="4" fill="#FF0033"/>

        <!-- linha 1 -->
        <rect x="12" y="4" width="4" height="4" fill="#B30022"/>
        <rect x="16" y="4" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="4" width="4" height="4" fill="#B30022"/>
        <rect x="32" y="4" width="4" height="4" fill="#B30022"/>
        <rect x="36" y="4" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="4" width="4" height="4" fill="#B30022"/>

        <!-- linha 2 -->
        <rect x="8" y="8" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="8" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="8" width="4" height="4" fill="#B30022"/>

        <!-- linha 3: olhos -->
        <rect x="8" y="12" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="12" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="12" width="4" height="4" fill="#FFFFFF"/>
        <rect x="20" y="12" width="4" height="4" fill="#000000"/>
        <rect x="24" y="12" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="12" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="12" width="4" height="4" fill="#FFFFFF"/>
        <rect x="36" y="12" width="4" height="4" fill="#000000"/>
        <rect x="40" y="12" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="12" width="4" height="4" fill="#B30022"/>

        <!-- linha 4 -->
        <rect x="8" y="16" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="16" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="16" width="4" height="4" fill="#B30022"/>

        <!-- linha 5: boca + dentes -->
        <rect x="8" y="20" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="20" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="20" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="20" width="4" height="4" fill="#000000"/>
        <rect x="24" y="20" width="4" height="4" fill="#000000"/>
        <rect x="28" y="20" width="4" height="4" fill="#000000"/>
        <rect x="32" y="20" width="4" height="4" fill="#000000"/>
        <rect x="36" y="20" width="4" height="4" fill="#FFFFFF"/>
        <rect x="40" y="20" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="20" width="4" height="4" fill="#B30022"/>

        <!-- linha 6: corpo + asa esquerda -->
        <rect x="0" y="24" width="4" height="4" fill="#B30022"/>
        <rect x="4" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="8" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="12" y="24" width="4" height="4" fill="#B30022"/>
        <rect x="16" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="24" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="24" width="4" height="4" fill="#B30022"/>
        <rect x="48" y="24" width="4" height="4" fill="#B30022"/>

        <!-- linha 7 -->
        <rect x="0" y="28" width="4" height="4" fill="#B30022"/>
        <rect x="4" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="8" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="12" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="28" width="4" height="4" fill="#FF0033"/>
        <rect x="48" y="28" width="4" height="4" fill="#B30022"/>

        <!-- linha 8: corpo + cauda começa -->
        <rect x="4" y="32" width="4" height="4" fill="#B30022"/>
        <rect x="8" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="12" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="32" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="32" width="4" height="4" fill="#B30022"/>
        <!-- cauda -->
        <rect x="56" y="32" width="4" height="4" fill="#B30022"/>
        <rect x="60" y="32" width="4" height="4" fill="#B30022"/>

        <!-- linha 9 -->
        <rect x="4" y="36" width="4" height="4" fill="#B30022"/>
        <rect x="8" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="12" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="36" width="4" height="4" fill="#FF0033"/>
        <rect x="48" y="36" width="4" height="4" fill="#B30022"/>
        <rect x="52" y="36" width="4" height="4" fill="#B30022"/>
        <!-- chama da cauda -->
        <rect x="60" y="36" width="4" height="4" fill="#FFAA00"/>
        <rect x="64" y="36" width="4" height="4" fill="#FFAA00"/>

        <!-- linha 10 -->
        <rect x="8" y="40" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="24" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="40" width="4" height="4" fill="#FF0033"/>
        <rect x="48" y="40" width="4" height="4" fill="#B30022"/>
        <rect x="56" y="40" width="4" height="4" fill="#FFAA00"/>
        <rect x="60" y="40" width="4" height="4" fill="#FFFF00"/>
        <rect x="64" y="40" width="4" height="4" fill="#FFAA00"/>

        <!-- linha 11 -->
        <rect x="8" y="44" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="28" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="44" width="4" height="4" fill="#FF0033"/>
        <rect x="48" y="44" width="4" height="4" fill="#B30022"/>
        <rect x="60" y="44" width="4" height="4" fill="#FFAA00"/>

        <!-- linha 12 -->
        <rect x="8" y="48" width="4" height="4" fill="#B30022"/>
        <rect x="12" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="16" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="20" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="32" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="36" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="40" y="48" width="4" height="4" fill="#FF0033"/>
        <rect x="44" y="48" width="4" height="4" fill="#B30022"/>

        <!-- linha 13: pernas (com walk cycle alternado) -->
        <g>
          <!-- perna esquerda -->
          <rect x="12" y="52" width="4" height="4" fill="#B30022">
            <animate attributeName="height" values="4;0;4;4" dur="0.4s" repeatCount="indefinite"/>
          </rect>
          <rect x="16" y="52" width="4" height="4" fill="#B30022">
            <animate attributeName="height" values="4;0;4;4" dur="0.4s" repeatCount="indefinite"/>
          </rect>
          <!-- perna direita -->
          <rect x="36" y="52" width="4" height="4" fill="#B30022">
            <animate attributeName="height" values="4;4;4;0" dur="0.4s" repeatCount="indefinite"/>
          </rect>
          <rect x="40" y="52" width="4" height="4" fill="#B30022">
            <animate attributeName="height" values="4;4;4;0" dur="0.4s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- garras -->
        <rect x="12" y="56" width="4" height="4" fill="#B30022">
          <animate attributeName="opacity" values="1;0;1;1" dur="0.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="36" y="56" width="4" height="4" fill="#B30022">
          <animate attributeName="opacity" values="1;1;1;0" dur="0.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- partículas de fogo deixadas pra trás (efeito de rastro) -->
  <circle cx="100" cy="80" r="2" fill="#FF0033">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="78" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="80" r="2" fill="#FF0033">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="78" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
